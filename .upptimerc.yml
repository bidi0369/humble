# Upptime configuration — copy this file to the ROOT of the humble-upptime
# repo (see docs/upptime/UPPTIME_SETUP.md for the 5-step setup).
# The status page renders from these names.
owner: bidi0369
repo: humble
secrets: []
sites:
  - name: HUMBLE store
    url: https://humble-store-nine.vercel.app/api/ping
    expectedStatusCodes:
      - 200
status-website:
  # No custom domain has been chosen. Use the repository's GitHub Pages URL.
  baseUrl: /humble
  name: HUMBLE status
  introTitle: "HUMBLE store uptime"
  introMessage: "Automated checks every 5 minutes. Powered by Upptime."
  navbar:
    - title: Status
      href: /
    - title: Store
      href: https://humble-store-nine.vercel.app
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"
